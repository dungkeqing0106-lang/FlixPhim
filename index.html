<style>

*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--tx);font:15px/1.5 "Noto Sans","Segoe UI",system-ui,sans-serif;min-height:100vh;background:var(--bg)}
button,select,input{font:inherit;color:inherit}

.glass,.card .im,.top input,.top select,.btn,.chip,.player,.msg-box{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}

.heart{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}.heart.f{fill:currentColor}

main{padding:0 0 130px}

.top select{border-radius:99px;padding:10px 16px}

h2{font:700 26px "Noto Sans",system-ui,sans-serif;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--cw));justify-content:space-between;gap:18px 16px}
.card{background:none;border:0;text-align:left;cursor:pointer}

.bd.o{background:#ff6a1a;color:#fff}

.bd.ep{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px)}
.card:hover .im{transform:translateY(-3px);border-color:var(--ac)}
.card{display:block;width:100%;min-width:0}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font-weight:600;font-size:14px;line-height:1.3;min-height:2.6em}

}

<script>
const SRC={
 kk:{n:'KKPhim',b:'https://phimapi.com',
  home:p=>`/danh-sach/phim-moi-cap-nhat-v3?page=${p}`,
  le:p=>`/v1/api/danh-sach/phim-le?page=${p}&limit=24`,
  bo:p=>`/v1/api/danh-sach/phim-bo?page=${p}&limit=24`,
  g:(s,p)=>`/v1/api/the-loai/${s}?page=${p}&limit=24`,
  q:(k,p)=>`/v1/api/tim-kiem?keyword=${k}&page=${p}&limit=24`,
  c:(s,p)=>`/v1/api/quoc-gia/${s}?page=${p}&limit=24`,
  h:p=>`/v1/api/danh-sach/hoat-hinh?page=${p}&limit=24`,
  d:s=>`/phim/${s}`},
 nc:{n:'NguonC',b:'https://phim.nguonc.com/api',
  home:p=>`/films/phim-moi-cap-nhat?page=${p}`,
  le:p=>`/films/danh-sach/phim-le?page=${p}`,
  bo:p=>`/films/danh-sach/phim-bo?page=${p}`,
  g:(s,p)=>`/films/the-loai/${s}?page=${p}`,
  q:(k,p)=>`/films/search?keyword=${k}`,
  c:(s,p)=>`/films/quoc-gia/${s}?page=${p}`,
  h:p=>`/films/danh-sach/hoat-hinh?page=${p}`,
  d:s=>`/film/${s}`},
 vs:{n:'VSMov',b:'https://vsmov.com/api',
  home:p=>`/danh-sach/phim-moi-cap-nhat?page=${p}`,
  le:p=>`/danh-sach/phim-le?page=${p}`,
  bo:p=>`/danh-sach/phim-bo?page=${p}`,
  g:(s,p)=>`/the-loai/${s}?page=${p}`,
  q:(k,p)=>`/tim-kiem?keyword=${k}&page=${p}`,
  c:(s,p)=>`/quoc-gia/${s}?page=${p}`,
  h:p=>`/danh-sach/hoat-hinh?page=${p}`,
  d:s=>`/phim/${s}`}
};
const GENRES=[['hanh-dong','Hành động'],['tinh-cam','Tình cảm'],['hai-huoc','Hài hước'],['co-trang','Cổ trang'],['tam-ly','Tâm lý'],['hinh-su','Hình sự'],['chien-tranh','Chiến tranh'],['the-thao','Thể thao'],['vo-thuat','Võ thuật'],['vien-tuong','Viễn tưởng'],['phieu-luu','Phiêu lưu'],['khoa-hoc','Khoa học'],['kinh-di','Kinh dị'],['am-nhac','Âm nhạc'],['than-thoai','Thần thoại'],['hoat-hinh','Hoạt hình'],['gia-dinh','Gia đình'],['bi-an','Bí ẩn'],['hoc-duong','Học đường'],['tai-lieu','Tài liệu']];

const $=s=>document.querySelector(s), view=$('#view');
let st={v:'home',g:null,q:'',p:1,tab:'fav'}, cur='kk';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={
 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem(k)}catch(e){}}
};
cur=ls.get('rd_src','kk'); if(!SRC[cur])cur='kk';
let user=ls.get('rd_session',null);
const K=k=>user?k+':'+user:k;
const store={get:k=>ls.get(K(k),[]),set:(k,v)=>ls.set(K(k),v)};
const users=()=>ls.get('rd_users',{});
const merge=(a,b)=>[...a,...b.filter(x=>!a.some(y=>y.slug===x.slug&&y.src===x.src))];
async function hash(pw,salt){
 const d=salt+':'+pw;
 try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch(e){let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}
}
const getAva=()=>user?(users()[user]||{}).avatar:ls.get('rd_avatar',null);
function setAva(a){
 if(user){const u=users();u[user]=u[user]||{};u[user].avatar=a;ls.set('rd_users',u)}
 else if(a)ls.set('rd_avatar',a);else ls.del('rd_avatar');
}
function resizeImg(file,cb){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas');c.width=c.height=160;
  const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;
  c.getContext('2d').drawImage(im,x,y,m,m,0,0,160,160);cb(c.toDataURL('image/jpeg',.85))};
  im.src=fr.result};
 fr.readAsDataURL(file);
}

async function api(src,path){
 const r=await fetch(SRC[src].b+path);
 if(!r.ok)throw new Error('HTTP '+r.status);
 return r.json();
}
function img(u,j){
 if(!u)return '';
 if(/^https?:/.test(u))return u;
 const d=j.data||{}, cdn=d.APP_DOMAIN_CDN_IMAGE||'';
 if(j.pathImage)return j.pathImage+u;
 if(u.includes('/'))return cdn+'/'+u.replace(/^\//,'');
 return cdn+'/uploads/movies/'+u;
}
function items(j,src){
 const d=j.data||j, list=d.items||j.items||[];
 return list.map(it=>({
  src,slug:it.slug,name:it.name,
  origin:it.origin_name||it.original_name||'',
  year:it.year||'',
  ep:(()=>{const c=it.episode_current||it.current_episode||'',t=it.total_episodes;return c&&t&&/^\d+$/.test(String(t))&&!String(c).includes(String(t))?c+' / '+t:c})(),
  quality:it.quality||'',lang:it.lang||it.language||'',
  thumb:img(it.thumb_url||it.poster_url,j),
  poster:img(it.poster_url,j)
 }));
}

function cards(list,cls){
 if(!list.length)return '<p class="msg">Không có phim nào để hiển thị.</p>';
 return '<div class="'+(cls||'grid')+'">'+list.map((m,i)=>`
 <button class="card" data-i="${i}">
  <div class="im" style="background-image:url('${esc(m.thumb)}')">${m.quality?`<span class="bds"><span class="bd o">${esc(m.quality)}</span></span>`:''}${m.ep?`<span class="bd o ep">${esc(m.ep)}</span>`:''}</div>
  <b>${esc(m.name)}</b><small>${esc(m.origin)}${m.year?' • '+esc(m.year):''}</small>
 </button>`).join('')+'</div>';
}
function bindCards(list,root){
 (root||view).querySelectorAll('.card').forEach(c=>c.onclick=()=>openMovie(list[c.dataset.i].src,list[c.dataset.i].slug));
}
function pager(hasNext){
 return `<div class="pager"><button class="btn" id="prev" ${st.p<=1?'disabled':''}>Trang trước</button><span>Trang ${st.p}</span><button class="btn" id="next" ${hasNext?'':'disabled'}>Trang sau</button></div>`;
}

const TITLES={le:'Phim lẻ',bo:'Phim bộ'};
const COUNTRIES=[['viet-nam','Việt Nam'],['trung-quoc','Trung Quốc'],['han-quoc','Hàn Quốc'],['nhat-ban','Nhật Bản'],['thai-lan','Thái Lan'],['hong-kong','Hồng Kông'],['dai-loan','Đài Loan'],['au-my','Âu Mỹ'],['an-do','Ấn Độ'],['anh','Anh'],['phap','Pháp'],['duc','Đức'],['canada','Canada'],['uc','Úc'],['nga','Nga'],['tay-ban-nha','Tây Ban Nha'],['tho-nhi-ky','Thổ Nhĩ Kỳ'],['philippines','Philippines'],['indonesia','Indonesia'],['brazil','Brazil']];
const ROWS=[['Phim mới nhất','new'],['Phim Việt Nam','c','viet-nam'],['Phim Nhật Bản','c','nhat-ban'],['Phim Hàn Quốc','c','han-quoc'],['Phim Trung Quốc','c','trung-quoc'],['Phim Thái Lan','c','thai-lan'],['Phim Hồng Kông','c','hong-kong'],['Phim Âu Mỹ','c','au-my'],['Phim hoạt hình','h']];
const rowPath=(S,r,p)=>r[1]==='new'?S.home(p):r[1]==='h'?S.h(p):S.c(r[2],p);
let heroT;

const cu=u=>"url('"+String(u||'').replace(/'/g,'%27')+"')";
function noHero(){const h=$('#hero');if(h)h.remove();view.classList.add('nohero')}
function showHero(list){
 const el=$('#hero');
 if(!el)return;
 if(!list.length)return noHero();
 let i=0;
 const draw=()=>{
  const m=list[i];
  el.style.setProperty('--bgl',cu(m.poster||m.thumb));
  el.style.setProperty('--bgp',cu(m.thumb||m.poster));
  el.innerHTML=`<div class="hbg"></div><div class="hcont">
  <div class="hbot"><div class="hinfo"><h1>${esc(m.name)}</h1><small>${esc([m.origin,m.year,m.ep].filter(Boolean).join(' • '))}</small></div>
  <button class="play" id="hgo" aria-label="Xem ${esc(m.name)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button></div>
  <div class="dots">${list.map((_,k)=>`<button class="dot ${k===i?'on':''}" data-k="${k}" aria-label="Phim nổi bật ${k+1}"></button>`).join('')}</div></div>`;
  $('#hgo').onclick=()=>openMovie(m.src,m.slug);
  el.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{i=+d.dataset.k;draw();restart()});
 };
 const restart=()=>{
  clearInterval(heroT);
  if(list.length>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)heroT=setInterval(()=>{i=(i+1)%list.length;draw()},6500);
 };
 draw();restart();
}

function renderHome(){
 const S=SRC[cur], my=cur;
 view.innerHTML='<div id="hero" class="hero"></div><div class="hwrap">'+ROWS.map((r,i)=>`<section class="rowsec"><div class="rh"><h2>${r[0]}</h2><button class="btn sm" data-r="${i}">Xem thêm</button></div><div class="rail" id="r${i}"><p class="msg" style="padding:20px 0">Đang tải...</p></div></section>`).join('')+'</div>';
 view.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st={...st,v:'cat',cat:ROWS[b.dataset.r],p:1,from:null};render()});
 ROWS.forEach(async(r,i)=>{
  const el=$('#r'+i);
  try{
   let list=items(await api(my,rowPath(S,r,1)),my);
   if(!el.isConnected||cur!==my)return;
   if(i===0){showHero(list.slice(0,5));if(list.length>=14)list=list.slice(5)}
   const L=list.slice(0,16);
   el.innerHTML=cards(L,'rail');
   if(L.length)bindCards(L,el);
  }catch(e){
   if(!el.isConnected)return;
   el.innerHTML=`<p class="msg" style="padding:20px 0">Không tải được mục này (${esc(e.message)}).</p>`;
   if(i===0)noHero()
  }
 });
}

async function render(){
 clearInterval(heroT);
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(st.v==='cat'?(st.from||'home'):st.v)));
 window.scrollTo(0,0);
 const S=SRC[cur];
 view.className=st.v==='home'?'home':'';updateTopAva();
 if(st.v==='home')return renderHome();
 if(st.v==='me')return renderMe();
 if(st.v==='genre'&&!st.g){
  view.innerHTML='<h2>Thể loại</h2><div class="chips">'+GENRES.map(g=>`<button class="chip" data-s="${g[0]}">${g[1]}</button>`).join('')+'</div><h2 style="margin-top:32px">Quốc gia</h2><div class="chips">'+COUNTRIES.map(c=>`<button class="chip" data-c="${c[0]}">${c[1]}</button>`).join('')+'</div>';
  view.querySelectorAll('[data-s]').forEach(c=>c.onclick=()=>{st.g=c.dataset.s;st.p=1;render()});
  view.querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{st={...st,v:'cat',cat:['Phim '+c.textContent,'c',c.dataset.c],p:1,from:'genre'};render()});
  return;
 }
 let path,title,back=null;
 if(st.v==='search'){path=S.q(encodeURIComponent(st.q),st.p);title='Kết quả: '+st.q}
 else if(st.v==='cat'){path=rowPath(S,st.cat,st.p);title=st.cat[0];back=st.from==='genre'?['genre','← Thể loại']:['home','← Trang chủ']}
 else if(st.v==='genre'){path=S.g(st.g,st.p);title=(GENRES.find(g=>g[0]===st.g)||[,st.g])[1];back=['genre','← Tất cả thể loại']}
 else{path=S[st.v](st.p);title=TITLES[st.v]}
 const head=`<h2>${esc(title)}</h2>`+(back?`<p style="margin-bottom:14px"><button class="btn" id="bk">${back[1]}</button></p>`:'');
 const bind=()=>{const b=$('#bk');if(b)b.onclick=()=>{st.g=null;st.from=null;st.v=back[0];st.p=1;render()}};
 view.innerHTML=head+'<p class="msg">Đang tải...</p>';bind();
 try{
  const list=items(await api(cur,path),cur);
  view.innerHTML=head+cards(list)+pager(list.length>=10&&!(cur==='nc'&&st.v==='search'));
  bind();bindCards(list);
  $('#prev').onclick=()=>{st.p--;render()};
  $('#next').onclick=()=>{st.p++;render()};
 }catch(e){
  view.innerHTML=head+`<p class="msg">Không tải được dữ liệu từ ${S.n} (${esc(e.message)}). Hãy thử nguồn khác hoặc kiểm tra kết nối.</p>`;bind();
 }
}

function renderMe(note){
 updateTopAva();
 const fav=store.get('fav'), his=store.get('his'), list=st.tab==='fav'?fav:his, ava=getAva();
 const reg=st.auth==='reg';
 view.innerHTML=`<h2>Cá nhân</h2>
 <section class="panel prof">
  <button class="ava" id="ava" aria-label="Đổi ảnh đại diện">${ava?`<img src="${esc(ava)}" alt="">`:esc((user||'Khách')[0].toUpperCase())}</button>
  <div class="pinfo"><b>${esc(user||'Khách')}</b><br><small>${user?'Dữ liệu đang lưu theo tài khoản này.':'Đăng nhập để lưu riêng và sao lưu dữ liệu.'}</small>
   <div class="row"><button class="btn" id="chava">Đổi ảnh đại diện</button>${ava?'<button class="btn" id="rmava">Xóa ảnh</button>':''}${user?'<button class="btn" id="out">Đăng xuất</button>':''}</div></div>
  <input type="file" id="file" accept="image/*" hidden>
 </section>
 ${note?`<p class="ok">${esc(note)}</p>`:''}
 ${user?'':`<section class="panel"><div class="tabs"><button class="chip ${reg?'':'on'}" data-a="login">Đăng nhập</button><button class="chip ${reg?'on':''}" data-a="reg">Đăng ký</button></div>
  <form class="authf" id="af"><input class="f" id="un" placeholder="Tên đăng nhập" autocomplete="username" required>
  <input class="f" id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="${reg?'new-password':'current-password'}" required>
  ${reg?'<input class="f" id="pw2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>':''}
  <div class="err" id="err"></div><button class="btn pri" type="submit">${reg?'Tạo tài khoản':'Đăng nhập'}</button></form>
  <p class="hint">Tài khoản được lưu ngay trên trình duyệt này. Phim yêu thích và lịch sử hiện tại sẽ được chuyển vào tài khoản khi đăng ký.</p></section>`}

 <section class="panel"><h3>Nguồn phim</h3><div class="chips">${Object.keys(SRC).map(k=>`<button class="chip ${k===cur?'on':''}" data-src="${k}">${SRC[k].n}</button>`).join('')}</div></section>

function parseDetail(j,src){
 const m=j.movie||j.data?.item||{};
 let servers;
 if(src==='nc')servers=(m.episodes||[]).map(s=>({name:s.server_name,eps:(s.items||[]).map(e=>({name:e.name,embed:e.embed,m3u8:e.m3u8}))}));
 else servers=(j.episodes||m.episodes||[]).map(s=>({name:s.server_name,eps:(s.server_data||[]).map(e=>({name:e.name,embed:e.link_embed,m3u8:e.link_m3u8}))}));
 let cats=[],country=[],year=m.year||'';
 const C=m.category;
 if(Array.isArray(C))cats=C.map(c=>c.name);
 else if(C&&typeof C==='object')Object.values(C).forEach(g=>{
  const gn=(g.group&&g.group.name)||'',l=(g.list||[]).map(x=>x.name);
  if(/thể loại/i.test(gn))cats=l;else if(/quốc gia/i.test(gn))country=l;else if(/năm/i.test(gn))year=year||l[0];
 });
 if(Array.isArray(m.country))country=m.country.map(c=>c.name);
 const arr=v=>Array.isArray(v)?v.filter(Boolean):typeof v==='string'?v.split(',').map(x=>x.trim()).filter(Boolean):[];
 const season=(m.tmdb&&m.tmdb.season)||((m.name||'').match(/(?:phần|season|mùa)\s*(\d+)/i)||[])[1]||'';
 return{
  name:m.name,origin:m.origin_name||m.original_name||'',year,
  content:(m.content||m.description||'').replace(/<[^>]*>/g,'').trim(),
  thumb:img(m.thumb_url||m.poster_url,j),cats,country,servers,season,
  ep:m.episode_current||m.current_episode||'',total:m.episode_total||m.total_episodes||'',
  quality:m.quality||'',lang:m.lang||m.language||'',time:m.time||'',
  actors:arr(m.actor||m.casts),directors:arr(m.director)
 };
}

async function openMovie(src,slug){

  mountMovie(src,slug,parseDetail(await api(src,SRC[src].d(slug)),src));

  view.innerHTML=`<p style="margin-bottom:14px"><button class="btn" id="back">← Quay lại</button></p><p class="msg">Không tải được phim (${esc(e.message)}).</p>`;

 </div>`:'<p class="msg">Phim chưa có tập nào.</p>'}
 <div class="ttl"><div><h1>${esc(d.name)}</h1><small id="nowp">${esc(d.origin)}</small></div>

 ${hasEp?'<section class="panel" id="epp"></section>':''}
 <section class="panel syn">${d.thumb?`<img src="${esc(d.thumb)}" alt="">`:''}<div class="sb"><h3>Nội dung phim</h3>
  <p class="txt clamp" id="syn">${esc(d.content||'Chưa có nội dung cho phim này.')}</p>
  ${d.content.length>260?'<button class="btn sm" id="more">Xem thêm</button>':''}

 $('#back').onclick=()=>render();
 const fb=$('#fav'),isFav=()=>store.get('fav').some(f=>f.slug===slug&&f.src===src);
 const setF=()=>fb.innerHTML=heart(isFav())+(isFav()?'Bỏ yêu thích':'Thêm vào yêu thích');

 const pw=$('#pw'),v=$('#vid'),ifr=$('#ifr'),epp=$('#epp'),nb=$('#nb');
 const posKey='pos:'+src+':'+slug;
 let si=0,ei=0,hls=null,mode='auto',partsHtml='',tT,nI,tI,lastSave=0;
 const saved=ls.get(posKey,null);
 let t0=0;
 if(saved&&d.servers[saved.si]&&d.servers[saved.si].eps[saved.ei]){si=saved.si;ei=saved.ei;t0=saved.t||0}
 else si=Math.max(0,d.servers.findIndex(s=>s.eps.length));
 const eps=()=>d.servers[si].eps;
 const toast=(m,ms=1400)=>{const el=$('#pt');el.textContent=m;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),ms)};
 const poke=()=>{pw.classList.remove('idle');clearTimeout(tI);if(!v.paused&&!pw.classList.contains('emb'))tI=setTimeout(()=>pw.classList.add('idle'),3000)};
 const syncPlay=()=>{const p=v.paused;pw.classList.toggle('paused',p);$('#b-play').innerHTML=ic(p?'play':'pause');$('#bp').innerHTML=ic('play');poke()};
 const syncMute=()=>{$('#b-mute').innerHTML=ic(v.muted||v.volume===0?'mute':'vol')};
 const toggle=()=>{v.paused?tryPlay():v.pause()};
 const tryPlay=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;syncMute();v.play().catch(()=>{});toast('Đang tắt tiếng. Bấm biểu tượng loa để bật.',2600)})};
 const seekBy=s=>{if(!v.duration)return;v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+s));toast((s>0?'+':'−')+Math.abs(s)+' giây',700);poke()};

 const cancelNext=()=>{clearInterval(nI);nb.hidden=true};

 const upd=()=>{
  const dur=v.duration||0,cur=v.currentTime||0,p=dur?cur/dur*100:0;
  $('#sprog').style.width=p+'%';$('#sknob').style.left=p+'%';
  $('#tm').textContent=fmt(cur)+' / '+fmt(dur);
  if(dur&&v.buffered.length)$('#sbuf').style.width=Math.min(100,v.buffered.end(v.buffered.length-1)/dur*100)+'%';
 };

 function load(start,force){
  const e=eps()[ei]; if(!e)return;
  if(hls){hls.destroy();hls=null}
  cancelNext();
  const emb=force||mode==='embed'||!e.m3u8;
  pw.classList.toggle('emb',emb);pw.classList.remove('buf');
  if(emb){
   v.pause();v.removeAttribute('src');v.load();
   ifr.src=e.embed||e.m3u8||'about:blank';
   if(!e.m3u8&&mode!=='embed')toast('Tập này chỉ có bản Embed.',2400);
  }else{
   ifr.src='about:blank';
   if(window.Hls&&Hls.isSupported()){
    hls=new Hls({startPosition:start>0?start:-1,maxBufferLength:40});
    hls.loadSource(e.m3u8);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,x)=>{if(x.fatal){toast('Không phát được M3U8, chuyển sang Embed.',2600);load(0,true)}});
   }else{
    v.src=e.m3u8;
    if(start>0)v.addEventListener('loadedmetadata',()=>{v.currentTime=start},{once:true});
   }
   tryPlay();
   if(start>5)toast('Tiếp tục từ '+fmt(start),2400);
  }
  $('#ptitle').textContent=d.name+' — '+lab(e.name);
  $('#nowp').textContent=(d.servers.length>1?d.servers[si].name+' • ':'')+'Đang phát: '+lab(e.name);
  $('#b-next').disabled=ei>=eps().length-1;
  $('#mode').textContent='Trình phát: '+(mode==='embed'?'Embed':'Tùy chỉnh');
  epp.querySelectorAll('.epb').forEach((b,i)=>b.classList.toggle('on',i===ei));
  const a=epp.querySelector('.epb.on'),g=epp.querySelector('.epg');
  if(a&&g)g.scrollTop=a.offsetTop-g.clientHeight/2+a.clientHeight/2;
  ls.set(posKey,{si,ei,t:start||0});
  store.set('his',[{...item,ep:lab(e.name)},...store.get('his').filter(x=>!(x.slug===slug&&x.src===src))].slice(0,60));
  upd();syncPlay();
 }

 function drawEps(){
  epp.innerHTML=`<div class="eh"><h3>Danh sách tập</h3><span class="cnt">${eps().length} tập${d.servers.length>1?' • '+d.servers.length+' máy chủ':''}</span></div>
  ${d.servers.length>1?`<div class="tabs sv">${d.servers.map((s,i)=>`<button class="chip ${i===si?'on':''}" data-s="${i}">${esc(s.name)}</button>`).join('')}</div>`:''}
  <div class="epg">${eps().map((e,i)=>`<button class="epb ${i===ei?'on':''}" data-e="${i}">${esc(lab(e.name))}</button>`).join('')}</div>${partsHtml}`;
  epp.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=v.currentTime||0;si=+b.dataset.s;ei=Math.min(ei,eps().length-1);drawEps();load(t)});
  epp.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ei=+b.dataset.e;window.scrollTo({top:0,behavior:'smooth'});load(0)});
  epp.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openMovie(src,b.dataset.p));
 }

 const sk=$('#seek');let drag=false;
 const seekTo=e=>{const r=sk.getBoundingClientRect();if(v.duration){v.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*v.duration;upd()}};

 v.onplaying=v.oncanplay=()=>pw.classList.remove('buf');
 v.onerror=()=>{if(!pw.classList.contains('emb')&&!hls){toast('Không phát được video, chuyển sang Embed.',2600);load(0,true)}};
 v.ontimeupdate=()=>{upd();const n=Date.now();if(n-lastSave>5000&&v.currentTime>5){lastSave=n;ls.set(posKey,{si,ei,t:Math.floor(v.currentTime)})}};
 v.onended=()=>{ls.set(posKey,{si,ei,t:0});ei<eps().length-1?showNext():toast('Bạn đã xem hết phim.',2400)};
 ['mousemove','touchstart','focusin'].forEach(ev=>pw.addEventListener(ev,poke,{passive:true}));
 document.onfullscreenchange=document.onwebkitfullscreenchange=()=>{$('#b-fs').innerHTML=ic(fsEl()?'xfs':'fs')};
 document.onkeydown=e=>{
  if(!pw.isConnected||pw.classList.contains('emb')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key;
  if(k===' '&&e.target.tagName!=='BUTTON')toggle();
  else if(k==='k')toggle();
  else if(k==='ArrowRight')seekBy(10);
  else if(k==='ArrowLeft')seekBy(-10);
  else if(k==='f')toggleFs();
  else if(k==='m')v.muted=!v.muted;
  else if(k==='n')nextEp();
  else return;
  e.preventDefault();poke();
 };
 $('#b-fs').innerHTML=ic('fs');syncMute();
 drawEps();load(t0);

 // các phần khác của phim
 const base=(d.name||'').replace(/\s*[\(\[]?\s*(?:phần|season|mùa|ss)\s*\d+\s*[\)\]]?\s*$/i,'').trim();
 if(base.length>1)api(src,SRC[src].q(encodeURIComponent(base),1)).then(j=>{
  let L=items(j,src).filter(x=>x.name.toLowerCase().startsWith(base.toLowerCase()));
  if(!L.some(x=>x.slug===slug))L.unshift({slug,name:d.name});
  if(L.length<2||!pw.isConnected)return;
  partsHtml=`<div class="parts"><h4>Các phần của phim</h4><div class="chips">${L.slice(0,10).map(x=>`<button class="chip ${x.slug===slug?'on':''}" data-p="${esc(x.slug)}">${esc(x.name)}</button>`).join('')}</div></div>`;
  drawEps();
 }).catch(()=>{});
}

$('#nav').onclick=e=>{
 const b=e.target.closest('button'); if(!b)return;
 st={...st,v:b.dataset.v,g:null,p:1,from:null}; render();
};
$('#q').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.value.trim()){st={...st,v:'search',q:e.target.value.trim(),p:1};render()}
});
const sr=$('#srch'), qi=$('#q');
const go=()=>{const v=qi.value.trim();if(v){st={...st,v:'search',q:v,p:1};render()}};
$('#sbtn').onclick=()=>{
 if(sr.classList.contains('open')&&qi.value.trim())return go();
 sr.classList.toggle('open');
 if(sr.classList.contains('open'))qi.focus();
};
qi.addEventListener('keydown',e=>{if(e.key==='Escape'){qi.value='';sr.classList.remove('open');qi.blur()}});
qi.addEventListener('blur',()=>{if(!qi.value.trim())setTimeout(()=>sr.classList.remove('open'),150)});
let dip=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const showBar=()=>{if(!standalone()&&!ls.get('rd_inst',0))$('#ibar').hidden=false};
const hideBar=()=>{$('#ibar').hidden=true};
function installApp(){
 if(dip){dip.prompt();dip.userChoice.finally(()=>{dip=null;hideBar()});return}
 $('#isteps').innerHTML=isIOS()
  ?'<li>Mở trang này bằng Safari.</li><li>Bấm nút Chia sẻ (hình vuông có mũi tên lên) ở thanh dưới.</li><li>Cuộn xuống và chọn “Thêm vào Màn hình chính”.</li><li>Bấm “Thêm” ở góc trên bên phải.</li>'
  :'<li>Bấm nút menu ⋮ của trình duyệt.</li><li>Chọn “Thêm vào màn hình chính” hoặc “Cài đặt ứng dụng”.</li><li>Xác nhận “Thêm”.</li>';
 $('#isheet').hidden=false;
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;showBar()});
addEventListener('appinstalled',()=>{dip=null;hideBar()});
$('#ibtn').onclick=()=>{hideBar();installApp()};
$('#ix').onclick=()=>{ls.set('rd_inst',1);hideBar()};
$('#iok').onclick=()=>{$('#isheet').hidden=true};
$('#isheet').onclick=e=>{if(e.target.id==='isheet')e.target.hidden=true};
if(matchMedia('(max-width:720px)').matches||isIOS())setTimeout(showBar,2500);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

function updateTopAva(){
 const b=$('#avtb'), a=getAva();
 b.innerHTML=a?`<img src="${esc(a)}" alt="">`:esc((user||'K')[0].toUpperCase());
}
$('#avtb').onclick=()=>{st={...st,v:'me',g:null,p:1};render()};
const topEl=$('.top'), onScroll=()=>topEl.classList.toggle('solid',scrollY>60);
addEventListener('scroll',onScroll,{passive:true});onScroll();
render();
</script>
</body>
