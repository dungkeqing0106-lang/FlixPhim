<style>
:root{--cw:140px;--bg:#000;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--tx:#f4eefb;--mu:#b3aac2;--ac:#ffc46b;--r:16px}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--tx);font:15px/1.5 "Noto Sans","Segoe UI",system-ui,sans-serif;min-height:100vh;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.glass,.card .im,.top input,.top select,.btn,.chip,.player,.msg-box{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
aside{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;padding:8px;border-radius:26px;background:rgba(30,26,40,.55);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 12px 40px rgba(0,0,0,.45);max-width:calc(100vw - 20px)}
nav{display:flex;gap:4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;padding:8px 10px;background:none;border:0;border-radius:20px;color:var(--mu);cursor:pointer;font-size:12px;white-space:nowrap;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.heart{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}.heart.f{fill:currentColor}
nav button:hover{background:var(--glass2);color:var(--tx)}
nav button.on{background:var(--ac);color:#241705;font-weight:600}
main{padding:0 0 130px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px "Noto Sans",system-ui,sans-serif;letter-spacing:-.3px;color:#fff;margin-right:8px;white-space:nowrap}
.brand .logo{width:34px;height:34px;flex:none;filter:drop-shadow(0 4px 12px rgba(238,42,60,.4))}
.top select{border-radius:99px;padding:10px 16px}
.top select option{color:#111}
h2{font:700 26px "Noto Sans",system-ui,sans-serif;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--cw));justify-content:space-between;gap:18px 16px}
.card{background:none;border:0;text-align:left;cursor:pointer}
.card .im{aspect-ratio:2/3;border-radius:var(--r);background-size:cover;background-position:center;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.bds{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px}
.bd{display:inline-block;max-width:100%;padding:2px 8px;border-radius:8px;font-size:11.5px;font-weight:700;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.bd.o{background:#ff6a1a;color:#fff}
.bd.w{background:#fff;color:#e8550a}
.bd.ep{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px)}
.card:hover .im{transform:translateY(-3px);border-color:var(--ac)}
.card{display:block;width:100%;min-width:0}
.card b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font-weight:600;font-size:14px;line-height:1.3;min-height:2.6em}
.card small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:28px}
.btn{border-radius:99px;padding:9px 18px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border-radius:99px;padding:8px 18px;cursor:pointer}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);color:#241705;border-color:var(--ac);font-weight:600}
.msg{color:var(--mu);padding:40px 0;text-align:center}
.det{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:20px;padding:20px;border-radius:24px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.det img{width:200px;max-width:100%;border-radius:var(--r);align-self:flex-start}
.det .info{flex:1;min-width:240px}
.det p{color:var(--mu);margin:10px 0;max-width:70ch}
.player{border-radius:20px;aspect-ratio:16/9;margin:16px 0;overflow:hidden;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.eps{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.eps .chip{padding:6px 14px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
@media(max-width:720px){
 #view{padding:76px 14px 0}.hwrap{padding:0 14px}.top{padding:10px 14px}.top:has(.srch.open) .brand{display:none}
 .grid{grid-template-columns:repeat(3,1fr);gap:14px 10px}
 .rail{gap:10px}
 .rail .card{flex:0 0 calc((100vw - 44px)/3.3)}
 aside{bottom:10px;padding:6px;border-radius:24px;width:calc(100vw - 20px)}
 nav{justify-content:space-between}
 nav button{min-width:0;flex:1;padding:7px 2px;font-size:11px}
 .det{padding:14px}
}
.panel{padding:18px 20px;border-radius:24px;margin-bottom:16px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.panel h3{font-size:16px;margin-bottom:12px}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ava{width:88px;height:88px;border-radius:50%;overflow:hidden;padding:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#ff7a59);border:2px solid var(--line);font:700 36px "Noto Sans",system-ui,sans-serif;color:#241705}
.ava img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.authf{display:grid;gap:10px;max-width:360px}
input.f{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.err{color:#ff9b8a;min-height:1.3em;font-size:14px}
.ok{color:var(--ac);margin-bottom:14px}
.btn.pri{background:var(--ac);color:#241705;border-color:var(--ac);font-weight:600}
.srch{margin-left:auto;display:flex;align-items:center;height:42px;border-radius:99px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.srch input{width:0;padding:0;opacity:0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;outline:0;transition:width .25s,padding .25s,opacity .2s}
.srch.open input{width:min(260px,52vw);padding:0 4px 0 18px;opacity:1}
.srch input::placeholder{color:var(--mu)}
.srch button{width:40px;height:40px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--tx)}
.srch button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.rowsec{margin-bottom:26px}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rh h2{margin:0;font-size:21px}
.btn.sm{padding:5px 14px;font-size:13px}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.rail .card{flex:0 0 var(--cw);scroll-snap-align:start}
.rail .msg{flex:1}
.top{position:fixed;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:10px;padding:14px 24px;transition:background .25s,border-color .25s;border-bottom:1px solid transparent}
.top.solid{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom-color:var(--line)}
.avt{flex:none;width:42px;height:42px;border-radius:50%;overflow:hidden;padding:0;border:1px solid var(--line);background:linear-gradient(135deg,var(--ac),#ff7a59);color:#241705;font:700 18px "Noto Sans",system-ui,sans-serif;cursor:pointer;display:grid;place-items:center}
.avt img{width:100%;height:100%;object-fit:cover}
#view{max-width:1500px;margin:0 auto;padding:84px 24px 0}
#view.home{max-width:none;padding:0}
#view.home.nohero{padding-top:84px}
.hwrap{max-width:1500px;margin:0 auto;padding:0 24px}
.hero{position:relative;display:flex;align-items:flex-end;min-height:clamp(300px,52vh,480px);overflow:hidden;background:var(--glass);margin-bottom:10px}
.hbg{position:absolute;inset:0;background-image:var(--bgl);background-size:cover;background-position:center 20%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 26%),linear-gradient(to top,var(--bg) 2%,rgba(0,0,0,.55) 28%,transparent 62%)}
.hcont{position:relative;z-index:2;width:100%;max-width:1500px;margin:0 auto;padding:0 24px 22px}
.hbot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hinfo h1{font:700 clamp(22px,3.6vw,36px)/1.15 "Noto Sans",system-ui,sans-serif;text-shadow:0 2px 16px rgba(0,0,0,.6);max-width:20ch}
.hinfo small{display:block;margin-top:8px;color:#e4dcf0}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:#ee2a3c;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 28px rgba(238,42,60,.45);transition:transform .2s}

.play svg{width:25px;height:25px;fill:currentColor;margin-left:3px}
.dots{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dot{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0;transition:width .2s,background .2s}
.dot.on{width:28px;background:#fff}
@media(max-width:720px){.hbg{background-image:var(--bgp)}.hero{min-height:clamp(340px,58vh,500px)}.hcont{padding:0 16px 18px}.play{width:50px;height:50px}}
[hidden]{display:none!important}
.pwrap{position:relative;aspect-ratio:16/9;max-height:78vh;width:100%;background:#000;border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;user-select:none;-webkit-user-select:none;outline:0}
.pwrap:fullscreen,.pwrap:-webkit-full-screen{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;max-height:none!important;aspect-ratio:auto!important;margin:0!important;border:0;border-radius:0;background:#000}
.pwrap:fullscreen video,.pwrap:-webkit-full-screen video{object-fit:contain}
.pwrap video,.pwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.pwrap iframe{display:none}.pwrap.emb iframe{display:block}.pwrap.emb video,.pwrap.emb .pov{display:none}
.pov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;transition:opacity .25s}
.pov::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);pointer-events:none}
.surf{position:absolute;inset:0;cursor:pointer}
.ptop{position:absolute;top:0;left:0;right:0;padding:14px 18px 30px;font-weight:600;background:linear-gradient(rgba(0,0,0,.7),transparent);pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwrap.idle:not(.paused) .pov{opacity:0;cursor:none}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2;transition:opacity .2s}
.bigplay .ic{width:34px;height:34px;margin-left:4px}
.pwrap:not(.paused) .bigplay{opacity:0;pointer-events:none}
.pctl{position:relative;z-index:2;padding:0 14px 10px}
.seek{position:relative;height:20px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.seek::before{content:"";position:absolute;left:0;right:0;height:4px;border-radius:4px;background:rgba(255,255,255,.25);transition:height .15s}
.seek:hover::before{height:6px}
.buf,.prog{position:absolute;left:0;height:4px;border-radius:4px;width:0;pointer-events:none}
.buf{background:rgba(255,255,255,.35)}.prog{background:var(--ac)}
.knob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5);pointer-events:none}
.prow{display:flex;align-items:center;gap:2px}
.prow button{width:42px;height:42px;border:0;border-radius:50%;background:none;color:#fff;cursor:pointer;display:grid;place-items:center}
.prow button:hover:not(:disabled){background:rgba(255,255,255,.18)}
.prow button:disabled{opacity:.35;cursor:default}
.time{font-size:13px;margin-left:6px;color:#eee;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp{flex:1}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fl{fill:currentColor;stroke:none}
.spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spn .8s linear infinite;display:none;z-index:3;pointer-events:none}
.pwrap.buf .spin{display:block}
@keyframes spn{to{transform:rotate(360deg)}}
.ptoast{position:absolute;top:16%;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:99px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:4;white-space:nowrap}
.ptoast.show{opacity:1}
.nextbox{position:absolute;right:16px;bottom:84px;z-index:5;padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ttl{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}

.eh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.eh h3{margin:0}.cnt{color:var(--mu);font-size:13px}
.sv{margin-bottom:12px}
.epg{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:260px;overflow-y:auto;padding:2px}
.epb{padding:9px 6px;border-radius:12px;background:var(--glass);border:1px solid var(--line);cursor:pointer;font-size:14px}

.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:14px;font-size:14px}
.dl dt{color:var(--mu)}.dl dd{margin:0}
@media(max-width:720px){.pwrap{border-radius:16px}.prow button{width:36px;height:36px}.time{font-size:12px;margin-left:2px}.pctl{padding:0 8px 6px}.bigplay{width:62px;height:62px}.nextbox{bottom:76px;right:10px}}

 .top{padding-top:calc(10px + env(safe-area-inset-top,0px))}

async function hash(pw,salt){
 const d=salt+':'+pw;
 try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch(e){let h=5381;for(const c of d)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}
}

  const c=document.createElement('canvas');c.width=c.height=160;
  const m=Math.min(im.width,im.height),x=(im.width-m)/2,y=(im.height-m)/2;
  c.getContext('2d').drawImage(im,x,y,m,m,0,0,160,160);cb(c.toDataURL('image/jpeg',.85))};
  im.src=fr.result};
 fr.readAsDataURL(file);
}

function parseDetail(j,src){
 const m=j.movie||j.data?.item||{};
 let servers;
 if(src==='nc')servers=(m.episodes||[]).map(s=>({name:s.server_name,eps:(s.items||[]).map(e=>({name:e.name,embed:e.embed,m3u8:e.m3u8}))}));
 else servers=(j.episodes||m.episodes||[]).map(s=>({name:s.server_name,eps:(s.server_data||[]).map(e=>({name:e.name,embed:e.link_embed,m3u8:e.link_m3u8}))}));
 let cats=[],country=[],year=m.year||'';
 const C=m.category;
 if(Array.isArray(C))cats=C.map(c=>c.name);
 else if(C&&typeof C==='object')Object.values(C).forEach(g=>{
  const gn=(g.group&&g.group.name)||'',l=(g.list||[]).map(x=>x.name);
  if(/thể loại/i.test(gn))cats=l;else if(/quốc gia/i.test(gn))country=l;else if(/năm/i.test(gn))year=year||l[0];
 });
 if(Array.isArray(m.country))country=m.country.map(c=>c.name);
 const arr=v=>Array.isArray(v)?v.filter(Boolean):typeof v==='string'?v.split(',').map(x=>x.trim()).filter(Boolean):[];
 const season=(m.tmdb&&m.tmdb.season)||((m.name||'').match(/(?:phần|season|mùa)\s*(\d+)/i)||[])[1]||'';
 return{
  name:m.name,origin:m.origin_name||m.original_name||'',year,
  content:(m.content||m.description||'').replace(/<[^>]*>/g,'').trim(),
  thumb:img(m.thumb_url||m.poster_url,j),cats,country,servers,season,
  ep:m.episode_current||m.current_episode||'',total:m.episode_total||m.total_episodes||'',
  quality:m.quality||'',lang:m.lang||m.language||'',time:m.time||'',
  actors:arr(m.actor||m.casts),directors:arr(m.director)
 };
}

 const upd=()=>{

 };

 function load(start,force){
  const e=eps()[ei]; if(!e)return;
  if(hls){hls.destroy();hls=null}
  cancelNext();
  const emb=force||mode==='embed'||!e.m3u8;
  pw.classList.toggle('emb',emb);pw.classList.remove('buf');
  if(emb){
   v.pause();v.removeAttribute('src');v.load();
   ifr.src=e.embed||e.m3u8||'about:blank';
   if(!e.m3u8&&mode!=='embed')toast('Tập này chỉ có bản Embed.',2400);
  }else{
   ifr.src='about:blank';
   const apple=isIOS()||/^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
   const nativeHls=apple&&!!v.canPlayType('application/vnd.apple.mpegurl');
   if(!nativeHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls({startPosition:start>0?start:-1,maxBufferLength:40});
    let netTry=0,medTry=0;
    hls.loadSource(e.m3u8);hls.attachMedia(v);
    hls.on(Hls.Events.ERROR,(_,x)=>{
     if(!x.fatal)return;
     if(x.type===Hls.ErrorTypes.NETWORK_ERROR&&netTry++<2)hls.startLoad();
     else if(x.type===Hls.ErrorTypes.MEDIA_ERROR&&medTry++<2)hls.recoverMediaError();
     else{toast('Không phát được M3U8, chuyển sang Embed.',2600);load(0,true)}
    });
   }else{
    v.src=e.m3u8;
    if(start>0)v.addEventListener('loadedmetadata',()=>{v.currentTime=start},{once:true});
   }
   tryPlay();
   if(start>5)toast('Tiếp tục từ '+fmt(start),2400);
  }
  $('#ptitle').textContent=d.name+' — '+lab(e.name);
  $('#nowp').textContent=(d.servers.length>1?d.servers[si].name+' • ':'')+'Đang phát: '+lab(e.name);
  $('#b-next').disabled=ei>=eps().length-1;
  $('#mode').textContent='Trình phát: '+(mode==='embed'?'Embed':'Tùy chỉnh');
  epp.querySelectorAll('.epb').forEach((b,i)=>b.classList.toggle('on',i===ei));
  const a=epp.querySelector('.epb.on'),g=epp.querySelector('.epg');
  if(a&&g)g.scrollTop=a.offsetTop-g.clientHeight/2+a.clientHeight/2;
  ls.set(posKey,{si,ei,t:start||0});
  store.set('his',[{...item,ep:lab(e.name)},...store.get('his').filter(x=>!(x.slug===slug&&x.src===src))].slice(0,60));
  upd();syncPlay();setPlayLabel();
 }

 function hideEpick(){ep2.hidden=true;const b=$('#b-eps');if(b)b.focus({preventScroll:true})}
 function openPicker(){
  const list=eps();
  ep2.innerHTML=`<div class="eh"><h3>Chọn tập</h3><span class="cnt">${list.length} tập</span></div>${d.servers.length>1?`<div class="tabs sv">${d.servers.map((s,i)=>`<button class="chip ${i===si?'on':''}" data-ps="${i}">${esc(s.name)}</button>`).join('')}</div>`:''}<div class="epg">${list.map((e,i)=>`<button class="epb ${i===ei?'on':''}" data-pe="${i}">${esc(lab(e.name))}</button>`).join('')}</div>`;

 function drawEps(){

  epp.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const t=v.currentTime||0;si=+b.dataset.s;ei=Math.min(ei,eps().length-1);drawEps();if(started)load(t)});
  epp.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ei=+b.dataset.e;window.scrollTo({top:0,behavior:'smooth'});play(0)});

 const sk=$('#seek');let drag=false;

 sk.onpointerdown=e=>{drag=true;sk.setPointerCapture(e.pointerId);seekTo(e)};

 v.ontimeupdate=()=>{if(!pw.classList.contains('idle'))upd();const n=Date.now();if(n-lastSave>5000&&v.currentTime>5){lastSave=n;ls.set(posKey,{si,ei,t:Math.floor(v.currentTime)})}};
 v.onended=()=>{ls.set(posKey,{si,ei,t:0});ei<eps().length-1?showNext():toast('Bạn đã xem hết phim.',2400)};
 ['mousemove','touchstart','focusin'].forEach(ev=>pw.addEventListener(ev,poke,{passive:true}));
 document.onfullscreenchange=document.onwebkitfullscreenchange=()=>{if(!fsEl()&&pw.classList.contains('pfs'))exitFs();$('#b-fs').innerHTML=ic(isFull()?'xfs':'fs')};
 document.onkeydown=e=>{
  if(!pw.isConnected||pw.classList.contains('emb')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const k=e.key,kc=e.keyCode,tvK=document.documentElement.classList.contains('tv');
  if(tvK&&(k==='ArrowLeft'||k==='ArrowRight')&&e.target!==pw)return;
  if(tvK&&k==='Enter'&&e.target===pw)toggle();
  else if(k==='MediaPlayPause'||k==='MediaPlay'||k==='MediaPause'||kc===415||kc===19||kc===10252)toggle();
  else if(k==='MediaFastForward'||kc===417)seekBy(10);
  else if(k==='MediaRewind'||kc===412)seekBy(-10);
  else if(k===' '&&e.target.tagName!=='BUTTON')toggle();
  else if(k==='k')toggle();
  else if(k==='ArrowRight')seekBy(10);
  else if(k==='ArrowLeft')seekBy(-10);
  else if(k==='f')toggleFs();
  else if(k==='m')v.muted=!v.muted;
  else if(k==='n')nextEp();
  else return;
  e.preventDefault();poke();
 };
 $('#b-fs').innerHTML=ic('fs');syncMute();
 drawEps();
 if(TVm()){pw.classList.add('tvhold');setPlayLabel();setTimeout(()=>{const b=$('#tvplay');if(b)b.focus({preventScroll:true})},60)}
 else{started=true;load(t0)}

 // các phần khác của phim
 const base=(d.name||'').replace(/\s*[\(\[]?\s*(?:phần|season|mùa|ss)\s*\d+\s*[\)\]]?\s*$/i,'').trim();
 if(base.length>1)api(src,SRC[src].q(encodeURIComponent(base),1)).then(j=>{
  let L=items(j,src).filter(x=>x.name.toLowerCase().startsWith(base.toLowerCase()));

  drawEps();
 }).catch(()=>{});
}

/* ===== Chế độ TV ===== */
const rootEl=document.documentElement;
const tvOn=()=>rootEl.classList.contains('tv');
const tvAuto=()=>{
 if(/[?&]tv=0/.test(location.search))return false;
 if(/[?&]tv=1/.test(location.search))return true;
 const f=ls.get('rd_tv',0);
 if(f===1)return true; if(f===2)return false;
 return /smart-?tv|tizen|web0s|webos|netcast|bravia|hbbtv|vidaa|\baft[a-z]|android tv|googletv|crkey|appletv|roku|philipstv|hisense|viera|large screen/i.test(navigator.userAgent);
};
const setScale=()=>rootEl.style.setProperty('--s',Math.max(1,Math.min(2.2,innerWidth/1280)).toFixed(2));
function setTV(on){
 ls.set('rd_tv',on?1:2);
 rootEl.classList.toggle('tv',on);
 cur=on?'kk':ls.get('rd_src','kk');if(!SRC[cur])cur='kk';
 if(on){setScale();setTimeout(focusFirst,200)}else document.activeElement&&document.activeElement.blur();
}
function focusFirst(){
 const t=$('#tvplay')||$('#hgo')||view.querySelector('.card,.chip,.btn,.epb')||document.querySelector('nav button');
 if(t)t.focus({preventScroll:true});
}
const FSEL='button:not([disabled]),input,select,a[href]';
const visible=el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.closest('[hidden]')};
function moveFocus(dir){
 const cur=document.activeElement&&document.activeElement!==document.body?document.activeElement:null;
 if(cur&&(dir==='ArrowLeft'||dir==='ArrowRight')&&cur.matches('.card,.epb,.chip,.dot')){
  const sib=dir==='ArrowRight'?cur.nextElementSibling:cur.previousElementSibling;
  if(sib&&sib.matches('button')){sib.focus({preventScroll:true});sib.scrollIntoView({block:'nearest',inline:'nearest'});return}
 }
 const pf=document.querySelector('.pwrap.pfs');
 let els=[...document.querySelectorAll(FSEL)].filter(visible);
 if(pf)els=els.filter(el=>pf.contains(el));
 if(!cur||!els.includes(cur)&&cur.id!=='pw'){focusFirst();return}
 const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;
 let best=null,bs=1e9;
 for(const el of els){
  if(el===cur)continue;
  const r=el.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;
  let ok,sc;
  if(dir==='ArrowRight'){ok=dx>8;sc=Math.abs(dx)+2.5*Math.abs(dy)}
  else if(dir==='ArrowLeft'){ok=dx<-8;sc=Math.abs(dx)+2.5*Math.abs(dy)}
  else if(dir==='ArrowDown'){ok=dy>8;sc=Math.abs(dy)+2.5*Math.abs(dx)}
  else{ok=dy<-8;sc=Math.abs(dy)+2.5*Math.abs(dx)}
  if(ok&&sc<bs){bs=sc;best=el}
 }
 if(!best&&pf&&dir==='ArrowUp'){pf.focus({preventScroll:true});return}
 if(best){best.focus({preventScroll:true});if(!pf)best.scrollIntoView({block:(dir==='ArrowUp'||dir==='ArrowDown')?'center':'nearest',inline:'nearest'})}
}
function goBack(e){

 if(window.__exitFs&&document.querySelector('.pwrap.pfs')){window.__exitFs();e.preventDefault();return}
 const fs=document.fullscreenElement||document.webkitFullscreenElement;
 if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document);e.preventDefault();return}
 const b=$('#back')||$('#bk');
 if(b){b.click();e.preventDefault();return}
 if(st.v!=='home'){st={...st,v:'home',g:null,p:1,from:null};render();e.preventDefault()}
}

 return false;
};
document.addEventListener('keydown',e=>{
 if(!tvOn())return;
 const k=e.key,kc=e.keyCode,inInp=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName),pw=$('#pw'),onPw=pw&&document.activeElement===pw;
 if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
  if(inInp&&(k==='ArrowLeft'||k==='ArrowRight'))return;
  if(onPw&&(k==='ArrowLeft'||k==='ArrowRight'))return;
  if(onPw&&k==='ArrowDown'){const b=$('#b-play');if(b){b.focus();pw.classList.remove('idle');e.preventDefault();e.stopPropagation();return}}
  e.preventDefault();e.stopPropagation();moveFocus(k);
 }else if(!inInp&&(k==='Backspace'||k==='Escape'||kc===10009||kc===461||k==='XF86Back'||k==='BrowserBack'))goBack(e);
},true);
